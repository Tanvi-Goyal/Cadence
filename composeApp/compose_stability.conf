// Compose compiler stability configuration.
//
// These types live in :shared, which has no Compose compiler, so the compiler cannot infer their
// stability and defaults them to "unstable". They are all immutable data holders — every field is
// a `val` of a primitive/String type, with NO collections — so we assert their stability here.
//
// Effect: composables taking these as parameters (e.g. SessionRow(session: Session)) skip on VALUE
// equality instead of relying on Strong Skipping's reference (===) comparison, which is more robust
// if the backing Flow ever re-emits equal-but-new instances.
//
// NOT listed: UI-state classes (HomeUiState, StatsUiState, LoggedItemUi) that hold List/Map. Those
// are unstable for a different reason (a read-only List may back a MutableList); the correct fix is
// kotlinx.collections.immutable, tracked separately — asserting stability over a raw List would be
// a weaker, less honest claim.

dev.cadence.data.local.Session
dev.cadence.data.local.SetEntry
dev.cadence.data.local.LoggedItem
dev.cadence.data.local.PlannedSession
dev.cadence.presentation.HistoryRow
dev.cadence.presentation.HomeStats
